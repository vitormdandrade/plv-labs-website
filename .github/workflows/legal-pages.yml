name: Legal pages

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Legal page guard (entity, placeholder, links, sitemap)
        run: python -m unittest discover -s tests -v
