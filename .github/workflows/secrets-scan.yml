name: Secrets Scan

# Blocks any pull request that introduces a new credential.
# Legacy findings are accepted by founder decision (22/11/2026) and are
# recorded in .gitleaks.toml, so this job stays green on existing history.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: No new secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Scan the commits this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --redact --verbose \
            --log-opts="origin/${BASE_REF}..HEAD"

      - name: Scan the pushed commit
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts="-1"

      - name: Scan the whole history (manual run, legacy allowlisted)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --redact --verbose
